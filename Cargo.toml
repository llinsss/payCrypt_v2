[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.test]
# Golden tests for contract events rely on deterministic ledger/time fixtures
# and stable event ordering; keep debug assertions on for boundary checks.
opt-level = 0
debug-assertions = true
overflow-checks = true

[dev-dependencies]
# Property tests for nonce replay protection (issue #824) exercise
# authorization, boundary values, resource limits, and external-call
# failure paths against deterministic ledger/time fixtures.
proptest = "1.4.0"
# Fuzz tests for payment amount arithmetic (issue #826) drive the same
# deterministic ledger/time fixtures through success, boundary,
# unauthorized, replay, and external-call failure paths.
arbitrary = { version = "1.3.2", features = ["derive"] }
