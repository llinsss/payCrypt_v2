[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

# Pinned inputs for deterministic Rust contract documentation generation (#868).
# The docgen toolchain and its dependencies are pinned so that generated
# documentation artifacts are byte-for-byte reproducible across environments.
[workspace.metadata.docgen]
toolchain = "1.79.0"
rustdoc-args = ["--cfg", "docsrs", "--document-private-items"]
features = ["docs"]
# Deterministic artifact identity: docs are hashed over the pinned inputs below.
artifact-hash-algorithm = "sha256"
artifact-version = "1"
# Environment validation performed before generation/release.
required-env = ["DOCGEN_OUTPUT_DIR"]
release-approval = "manual"
rollback = "restore-previous-artifact"

# Changelog policy for Rust/Soroban contract releases (#869).
# Pinned inputs, artifact identity, environment validation, release approval,
# and rollback behavior for the contract changelog are declared here so the
# policy is deterministic and machine-checkable.
[workspace.metadata.changelog]
# Pinned inputs: the changelog is generated only from these sources.
sources = ["CHANGELOG.md", "contracts/*/CHANGELOG.md"]
toolchain = "1.79.0"
# Artifact identity: the changelog artifact is hashed over the pinned inputs.
artifact-hash-algorithm = "sha256"
artifact-version = "1"
# Environment validation performed before changelog generation/release.
required-env = ["CHANGELOG_OUTPUT_DIR"]
# Release approval gate for publishing a changelog artifact.
release-approval = "manual"
# Rollback behavior when a released changelog artifact is rejected.
rollback = "restore-previous-artifact"

# Local development bootstrap for Rust/Soroban contracts (#870).
# Pinned inputs, artifact identity, environment validation, release approval,
# and rollback behavior for the local dev bootstrap are declared here so the
# bootstrap is deterministic and machine-checkable.
[workspace.metadata.bootstrap]
# Pinned inputs: the bootstrap provisions exactly these toolchain/contract versions.
toolchain = "1.79.0"
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"
soroban-cli = "21.7.6"
# Local network used by the bootstrap for local-network tests.
local-network = "standalone"
# Artifact identity: the bootstrap artifact is hashed over the pinned inputs.
artifact-hash-algorithm = "sha256"
artifact-version = "1"
# Environment validation performed before the bootstrap runs.
required-env = ["SOROBAN_NETWORK", "SOROBAN_RPC_URL", "SOROBAN_NETWORK_PASSPHRASE"]
# Release approval gate for promoting a bootstrapped environment.
release-approval = "manual"
# Rollback behavior when a bootstrapped environment is rejected.
rollback = "restore-previous-artifact"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
