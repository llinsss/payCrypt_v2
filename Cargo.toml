[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[workspace.metadata.mutants]
# Mutation testing configuration for Rust authorization paths (issue #836).
# Run with: cargo mutants --workspace --in-place
# Deterministic ledger/time fixtures are provided by soroban-sdk's testutils
# (Env::default() with a fixed ledger sequence and timestamp), so mutation
# runs are reproducible across machines and CI.
timeout = 120
minimum_test_timeout = 30
exclude_globs = [
    "deploy/**",
    "tests/**",
]
examine_globs = [
    "contracts/**/src/**/*.rs",
    "crates/**/src/**/*.rs",
]
# Only mutate authorization-relevant code paths to keep runs focused and fast.
# Authorization, boundary values, resource limits, and external-call failure
# handling are all exercised by the unit/property/local-network tests.

[workspace.metadata.bench]
# Benchmark suite for contract hot paths (issue #837).
# Run with: cargo bench --workspace
#
# Hot paths covered:
#   - authorization: require_auth / require_auth_for_args on admin + user paths
#   - boundary values: i128 min/max, zero, and u32 ledger bounds
#   - resource limits: CPU instruction and memory budgets per invocation
#   - external-call failures: cross-contract calls that trap or return errors
#
# Determinism: every benchmark builds its Env from a fixed ledger sequence and
# timestamp fixture (see crates/bench-fixtures) so results are reproducible
# across machines and CI runners. Benchmarks are excluded from the default
# `cargo test` run and from mutation testing to keep those fast.
harness = false
exclude_globs = [
    "deploy/**",
]

[workspace.metadata.sdk-errors]
# Typed contract error surface for the Rust SDK (issue #838).
#
# The `soroban-sdk-errors` crate defines a `#[contracterror]` enum that is the
# single source of truth for every error a contract can return. The enum is
# `#[repr(u32)]` and its discriminants are frozen: they are part of the
# on-chain ABI and MUST NOT be renumbered or reused. New variants are appended
# with the next free discriminant so that already-deployed clients keep
# decoding old codes correctly.
#
# Classification (see `ErrorClass` in the crate):
#   - Authorization: unauthorized caller / missing auth
#   - Validation:    boundary, malformed, or out-of-range input
#   - Replay:        duplicate nonce / already-processed request
#   - Cancellation:  operation cancelled or expired before completion
#   - Internal:      invariant violation or unexpected failure
#
# Serialization: errors cross the contract boundary as a `u32` discriminant
# (Soroban `Status`/`Error` convention). The SDK exposes `TryFrom<u32>` and
# `Into<u32>` so host and client agree on the wire format deterministically.
#
# Migration: existing `panic!`/`unwrap` sites are replaced incrementally with
# `Result<_, ContractError>`; the numeric codes are stable so mixed-version
# deployments interoperate during rollout. Rollback is a revert of the crate
# version pin below; no on-chain state migration is required because error
# codes are not persisted.
#
# Indexing/monitoring: indexers should key on the numeric discriminant and map
# it through `ErrorClass` for alerting (e.g. page on `Internal`, rate-limit on
# `Replay`).
#
# Tests: unit + property tests live in `crates/soroban-sdk-errors/tests` and
# cover success, boundary, unauthorized, replay, and failure paths, including
# round-trip serialization and unknown-discriminant rejection.
#
# Run with: cargo test -p soroban-sdk-errors
crate = "soroban-sdk-errors"
wire_format = "u32"
stable_discriminants = true

[workspace.metadata.sdk-pagination]
# Pagination iterators for the Rust SDK (issue #840).
#
# The `soroban-sdk-pagination` crate exposes typed, cursor- and page-based
# iterators over contract collections. It is the single source of truth for
# how clients walk large result sets without loading them into memory.
#
# API surface (see `crates/soroban-sdk-pagination/src/lib.rs`):
#   - `PageRequest` / `CursorRequest`: typed request envelopes
#   - `Page<T>` / `Cursor<T>`: typed response envelopes
#   - `PageIter` / `CursorIter`: lazy iterators that fetch the next page on
#     demand and stop at exhaustion
#   - `PaginationError` + `ErrorClass`: actionable failure classification
#
# Deterministic validation: cursors are opaque, versioned, and validated
# before use. A cursor encodes the last-seen key plus a schema version; a
# cursor whose version does not match the current schema is rejected with
# `PaginationError::InvalidCursor` rather than silently mis-paginating.
# Page bounds (`limit`) are validated against `MIN_LIMIT`/`MAX_LIMIT` so a
# malformed request fails fast and deterministically.
#
# Serialization / compatibility: requests and responses serialize through
# Soroban's `Xdr`/`ScVal` conventions. Cursors are forward-compatible: new
# fields are appended and unknown trailing bytes are ignored, so a client on
# an older SDK can still consume pages produced by a newer contract. The
# numeric error discriminants are frozen (append-only) for the same reason.
#
# Cancellation: iterators are lazy and hold no server-side state. Dropping an
# iterator, or calling `cancel()`, stops further fetches immediately; an
# in-flight fetch observes the cancellation token and returns
# `PaginationError::Cancelled` instead of continuing to page.
#
# Error classification (see `ErrorClass`):
#   - InvalidCursor: malformed, stale, or version-mismatched cursor
#   - Unauthorized:  caller lacks auth for the requested collection
#   - Replay:        duplicate cursor / already-consumed page token
#   - Transient:     network or host error; safe to retry with backoff
#   - Exhausted:     no more pages; terminal, not an error to retry
#   - Cancelled:     iteration cancelled before completion
#
# Migration: existing call sites that hand-roll `start`/`limit` loops are
# replaced incrementally with `PageIter`/`CursorIter`. Cursors are not
# persisted on-chain, so rollback is a revert of the crate version pin below;
# no state migration is required.
#
# Indexing/monitoring: indexers should key on the numeric error discriminant
# and map it through `ErrorClass` for alerting (page on `Transient` only after
# retries are exhausted; treat `Exhausted` as normal termination).
#
# Tests: unit + property tests live in `crates/soroban-sdk-pagination/tests`
# and cover success, boundary (empty page, max limit, last page), unauthorized,
# replay, cancellation, and failure paths, including cursor round-trip and
# version-mismatch rejection.
#
# Run with: cargo test -p soroban-sdk-pagination
crate = "soroban-sdk-pagination"
cursor_version = 1
min_limit = 1
max_limit = 1000
stable_discriminants = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
