[package]
name = "taggedpay-soroban-allowlist"
version = "0.1.0"
edition = "2021"
description = "Soroban contract allowlist with token contract behavior validation"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doctype = true

[dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc"] }

[depdencies.stellar-token-client]
git = "https://github.com/stellar/rs-contracts-token-client"
rev = "d7c38b1a7f9e4b2c5d6e7a8b9c0d1e2f3a4b5c6d"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1

# Release validation for all Rust contract WASM files (issue #1010).
# `cargo run --bin release-validate` checks that every expected contract
# artifact exists, validates its contract spec, and fails with actionable
# messages when a crate or WASM artifact is missing.
[[bin]]
name = "release-validate"
path = "src/bin/release_validate.rs"
