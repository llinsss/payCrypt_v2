[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.test]
# Deterministic local-network authorization integration tests rely on the
# Soroban test harness (soroban-sdk testutils) which is compiled with the
# `test` profile. Keep optimizations off so ledger/time fixtures and
# authorization traces are reproducible across machines.
opt-level = 0
debug = true
incremental = true
