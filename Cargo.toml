[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

# Pinned toolchain for reproducible contract builds. The verification workflow
# (see scripts/verify-wasm.sh) reads this value to record the exact toolchain
# used to produce each deployed WASM hash.
[workspace.metadata.contract-verification]
toolchain = "1.78.0"
lockfile = "Cargo.lock"
optimization = "release"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
