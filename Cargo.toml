[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
# Soroban SDK versions are pinned exactly so generated WASM and
# authorization behavior cannot silently change between builds.
# See docs/soroban-upgrade-policy.md before bumping these.
soroban-sdk = "=21.7.6"
soroban-token-sdk = "=21.7.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
