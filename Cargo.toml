[package]
name = "taggedpay-soroban-allowlist"
version = "0.1.0"
edition = "2021"
description = "Soroban contract allowlist with token contract behavior validation"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doctype = true

[dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc", "testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1

# Release validation for all Rust contract WASM files (issue #1010).
# `cargo run --bin release-validate` checks that every expected contract
# artifact exists, validates its contract spec, and fails with actionable
# messages when a crate or WASM artifact is missing.
[[bin]]
name = "release-validate"
path = "src/bin/release_validate.rs"

# Signer-confusion prevention across Rust network environments (issue #807).
# The `network-binding` feature gates the typed network-environment binding
# (chain id / network passphrase) that ties signer authorization to a single
# Soroban network so signatures valid on one network cannot be replayed on
# another. It is enabled by default for production builds and can be turned
# off only for local-network test harnesses that need to exercise the
# unbound path.
#
# Relayer submission rate limiting (issue #808).
# The `relayer-rate-limit` feature gates the typed per-submitter/per-window
# rate-limit module that guards relayer submission. It is enabled by default
# for production builds and can be disabled only for local-network harnesses
# that need to exercise the unlimited path.
#
# Reserve protocol and system tags (issue #809).
# The `reserve-protocol` feature gates the typed reserve protocol module that
# defines the reserve trust boundary, privileged reserve roles, replay
# protection (monotonic reserve sequence), and failure-safe reserve state
# transitions. It is enabled by default for production builds and can be
# disabled only for local-network harnesses that need to exercise the
# unguarded path.
#
# Log redaction for Soroban auth entries and signed payloads (issue #812).
# The `log-redaction` feature gates the typed redaction module that strips
# Soroban authorization entries and signed payloads from log records before
# they are emitted. It is enabled by default for production builds and can be
# disabled only for local-network harnesses that need to exercise the raw
# (unredacted) logging path.
[features]
default = ["network-binding", "relayer-rate-limit", "reserve-protocol", "log-redaction"]
network-binding = []
relayer-rate-limit = []
reserve-protocol = []
log-redaction = []
