[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"
rust-version = "1.79"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[workspace.metadata.compatibility]
# Machine-readable release and compatibility matrix (issue #758).
# Consumed by CI to test supported network combinations and by tooling
# to validate upgrade sequencing and rollback limits.
schema-version = 1

[workspace.metadata.compatibility.rust]
version = "1.79"
channel = "stable"

[workspace.metadata.compatibility.soroban-sdk]
version = "21.7.6"

[workspace.metadata.compatibility.protocol]
version = 21

[workspace.metadata.compatibility.networks]
# Supported network combinations exercised in CI.
mainnet = { passphrase = "Public Global Stellar Network ; September 2015", protocol = 21 }
testnet = { passphrase = "Test SDF Network ; September 2015", protocol = 21 }
futurenet = { passphrase = "Test SDF Future Network ; October 2022", protocol = 21 }

[workspace.metadata.compatibility.contract-wasm]
# Contract WASM artifacts tracked per release.
path = "target/wasm32-unknown-unknown/release"
optimizer = "stellar contract optimize"

[workspace.metadata.compatibility.client-crates]
# Client crate compatibility with the contract WASM above.
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[workspace.metadata.compatibility.upgrade]
# Upgrade sequencing and rollback limits.
sequence = [
    "deploy-new-wasm",
    "migrate-state",
    "switch-contract-id",
    "verify-client-crates",
]
rollback = { supported = true, max-versions = 1, requires-state-snapshot = true }

[workspace.metadata.authorization]
# Authorization snapshot coverage for every public contract entry point (issue #759).
# Each entry lists the public method, the required authorization, and the
# caller classes exercised by the table-driven test suite in `tests/`.
# CI fails when a public method is missing from this table.
schema-version = 1

[workspace.metadata.authorization.entry-points]
# initialization
initialize = { requires-auth = false, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# tag ownership
tag_register = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
tag_transfer = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
tag_revoke = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# escrow settlement
escrow_create = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
escrow_settle = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
escrow_cancel = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# wallet withdrawals
wallet_withdraw = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# admin configuration
admin_set = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
admin_configure = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# upgrades
upgrade = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
# pause controls
pause = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }
unpause = { requires-auth = true, callers = ["authorized", "unauthorized", "forwarded", "contract-to-contract"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
