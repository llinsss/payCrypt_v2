[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
    "tests",
    "deploy",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/soroban-contracts"

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[workspace.metadata.mutants]
# Mutation testing configuration for Rust authorization paths (issue #836).
# Run with: cargo mutants --workspace --in-place
# Deterministic ledger/time fixtures are provided by soroban-sdk's testutils
# (Env::default() with a fixed ledger sequence and timestamp), so mutation
# runs are reproducible across machines and CI.
timeout = 120
minimum_test_timeout = 30
exclude_globs = [
    "deploy/**",
    "tests/**",
]
examine_globs = [
    "contracts/**/src/**/*.rs",
    "crates/**/src/**/*.rs",
]
# Only mutate authorization-relevant code paths to keep runs focused and fast.
# Authorization, boundary values, resource limits, and external-call failure
# handling are all exercised by the unit/property/local-network tests.

[workspace.metadata.bench]
# Benchmark suite for contract hot paths (issue #837).
# Run with: cargo bench --workspace
#
# Hot paths covered:
#   - authorization: require_auth / require_auth_for_args on admin + user paths
#   - boundary values: i128 min/max, zero, and u32 ledger bounds
#   - resource limits: CPU instruction and memory budgets per invocation
#   - external-call failures: cross-contract calls that trap or return errors
#
# Determinism: every benchmark builds its Env from a fixed ledger sequence and
# timestamp fixture (see crates/bench-fixtures) so results are reproducible
# across machines and CI runners. Benchmarks are excluded from the default
# `cargo test` run and from mutation testing to keep those fast.
harness = false
exclude_globs = [
    "deploy/**",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
