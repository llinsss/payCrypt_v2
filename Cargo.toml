[package]
name = "taggedpay-soroban-allowlist"
version = "0.1.0"
edition = "2021"
description = "Soroban contract allowlist with token contract behavior validation"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doctype = true

[dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc", "testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1

# Release validation for all Rust contract WASM files (issue #1010).
# `cargo run --bin release-validate` checks that every expected contract
# artifact exists, validates its contract spec, and fails with actionable
# messages when a crate or WASM artifact is missing.
[[bin]]
name = "release-validate"
path = "src/bin/release_validate.rs"

# Tag-squatting prevention (issue #810).
# The `tag-registry` binary hosts the deterministic tag registration
# validation logic (trust boundary, privileged roles, replay handling,
# and failure-safe state transitions) used to prevent tag squatting in
# the Rust/Soroban registry. Run its unit/property tests with
# `cargo test --bin tag-registry`.
[[bin]]
name = "tag-registry"
path = "src/bin/tag_registry.rs"
