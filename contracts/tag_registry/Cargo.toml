[package]
name = "tag_registry"
version = "0.1.0"
edition = "2021"
description = "Canonical Soroban tag registry: registration, resolution, ownership, and wallet association"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "20.0.0" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
