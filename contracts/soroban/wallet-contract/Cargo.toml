[package]
name = "wallet-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=23.5.3"

[dev-dependencies]
soroban-sdk = { version = "=23.5.3", features = ["testutils"] }
ed25519-dalek = "=2.2.0"

# Storage footprint benchmark: measures CPU/memory budgets for hot paths and
# checks them against committed ceilings (see benches/storage_footprint.rs).
[[bench]]
name = "storage_footprint"
path = "benches/storage_footprint.rs"
harness = false
