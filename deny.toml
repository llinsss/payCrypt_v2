# cargo-deny configuration for Rust contract and WASM artifact security scanning.
# See https://embarkstudios.github.io/cargo-deny/ for the full reference.

[graph]
# Scan the full dependency graph, including dev and build dependencies, so that
# advisories and licenses are checked for everything that can end up in a
# release artifact.
all-features = true

[advisories]
# Fail the pipeline on any advisory that has not been explicitly reviewed below.
version = 2
yanked = "deny"
unmaintained = "deny"
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "owner: @security-team, expires: 2025-12-31" },
]

[licenses]
# Fail on licenses that are not on the allow list.
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    # { allow = ["OpenSSL"], crate = "openssl", reason = "owner: @security-team, expires: 2025-12-31" },
]

[bans]
# Fail on banned crates and duplicate versions that could smuggle in
# unreviewed code into contract/WASM artifacts.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
    # { name = "openssl", reason = "owner: @security-team, expires: 2025-12-31" },
]
skip = [
    # { name = "windows-sys", reason = "owner: @security-team, expires: 2025-12-31" },
]

[sources]
# Fail on crates pulled from disallowed registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
