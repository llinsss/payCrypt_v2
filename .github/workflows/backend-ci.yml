name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: taggedpay_test
          POSTGRES_USER: taggedpay_test
          POSTGRES_PASSWORD: taggedpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taggedpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: taggedpay_test
      DB_USER: taggedpay_test
      DB_PASSWORD: taggedpay_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_long
      BULL_ADMIN_USER: ci_admin
      BULL_ADMIN_PASS: ci_admin_password
      SWAGGER_ADMIN_USER: ci_admin
      SWAGGER_ADMIN_PASS: ci_admin_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx --yes eslint .

      - name: Test
        run: npm test
