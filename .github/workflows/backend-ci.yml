name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # Deterministic fuzz seed published in CI so failures are reproducible.
  FUZZ_SEED: "0x5eed771"
  FUZZ_RUNS: "4096"

jobs:
  rust-contracts:
    name: Rust/Soroban contracts (fuzz + authorization coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --locked

      - name: Authorization coverage gate
        # Every public Soroban entry point must have an authorization test.
        # The gate script enumerates public methods and fails if any lacks a
        # corresponding `#[test]` exercising `require_auth`/`mock_auth`.
        run: cargo test --workspace --locked -- authorization_coverage

      - name: Fuzz public entry points
        # Fuzz tags, amounts, callers, ledger time, and operation sequences.
        # Deterministic seed is published so any failure can be replayed.
        run: |
          echo "Fuzz seed: ${FUZZ_SEED} (runs: ${FUZZ_RUNS})"
          cargo test --workspace --locked -- fuzz --nocapture
        env:
          PROPTEST_CASES: ${{ env.FUZZ_RUNS }}
          PROPTEST_SEED: ${{ env.FUZZ_SEED }}

      - name: Publish coverage
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-contract-coverage
          path: lcov.info

      - name: Publish deterministic fuzz seed
        run: |
          echo "## Rust contract fuzzing" >> $GITHUB_STEP_SUMMARY
          echo "- Deterministic seed: \`${FUZZ_SEED}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Fuzz runs: ${FUZZ_RUNS}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage report: lcov.info (artifact: rust-contract-coverage)" >> $GITHUB_STEP_SUMMARY
