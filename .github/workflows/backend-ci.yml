name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-security:
    name: Rust Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-audit (fail on unreviewed advisories)
        run: cargo audit --deny warnings

      - name: cargo-deny (licenses, bans, sources)
        run: cargo deny check licenses bans sources

      - name: clippy (security-relevant lints)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Build release artifacts
        run: cargo build --workspace --release

      - name: Scan release artifacts (WASM)
        run: |
          set -euo pipefail
          shopt -s nullglob
          wasm_files=(target/wasm32-unknown-unknown/release/*.wasm target/release/*.wasm)
          if [ ${#wasm_files[@]} -eq 0 ]; then
            echo "No WASM artifacts found to scan"
            exit 0
          fi
          for wasm in "${wasm_files[@]}"; do
            echo "Scanning $wasm"
            cargo audit --file "$wasm" || true
            if command -v wasm-objdump >/dev/null 2>&1; then
              wasm-objdump -x "$wasm" >/dev/null
            fi
          done

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
