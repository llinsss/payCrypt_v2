# Backend CI
# Stable check name: ci/backend
#
# Runs on pull_request when backend source files or their workflow change.
# Jobs:
#   detect   – path filter (always runs, ~5 s)
#   quality  – lint · dependency audit · jest test suite
#   rust     – rustfmt · clippy · cargo test · cargo-deny · cargo-audit (contracts & SDK crates)
#   wasm-verify – build contracts, record toolchain/lockfile/optimization/WASM hash,
#                 verify deployed hash and detect drift vs backend config
#
# Services: PostgreSQL 14, Redis 6 (mirrors production services)
# Artifacts: jest-results-<sha> retained 14 days
#
# MIGRATION & SEED STRATEGY:
# - Tests use pre-configured test database; no migrations run in CI
# - No seed data is loaded during CI; tests use fixtures or in-memory setup
# - This prevents demo data from ever being included in CI artifacts
# - Production deployments handle migrations & seeding separately at runtime
# See: backend/docs/SEED_CATEGORIZATION.md for seed categorization details

name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "contracts/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "contracts/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
            rust:
              - "contracts/**"
              - "sdk/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"

  # ── 2. Lint · Audit · Test ─────────────────────────────────────────────────
  quality:
    name: ci/backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: taggedpay_test
          POSTGRES_USER: taggedpay_test
          POSTGRES_PASSWORD: taggedpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taggedpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: taggedpay_test
      DB_USER: taggedpay_test
      DB_PASSWORD: taggedpay_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_long
      BULL_ADMIN_USER: ci_admin
      BULL_ADMIN_PASS: ci_admin_password
      SWAGGER_ADMIN_USER: ci_admin
      SWAGGER_ADMIN_PASS: ci_admin_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Migration IDs must be unique and ordered ─────────────────────────
      - name: Check migration identifiers
        run: npm run check:migrations

      # ── Security audit (high/critical only, non-blocking for moderate) ────
      - name: Dependency security audit
        run: npm audit --audit-level=high
        # Annotate but don't fail on moderate-severity findings; critical/high
        # findings cause a non-zero exit and block the PR.
        continue-on-error: false

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests
        run: npm test -- --json --outputFile=/tmp/jest-results.json
        continue-on-error: false

      # ── Upload results ────────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results-${{ github.sha }}
          path: /tmp/jest-results.json
          retention-days: 14
          if-no-files-found: warn

  # ── 3. Rust quality & dependency security gates ────────────────────────────
  rust:
    name: ci/rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Formatting ────────────────────────────────────────────────────────
      - name: rustfmt check
        run: cargo fmt --all -- --check

      # ── Clippy (warnings denied) ──────────────────────────────────────────
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ── Test suite ───────────────────────────────────────────────────────
      - name: cargo test
        run: cargo test --all-features

      # ── Dependency license / ban / advisory checks ────────────────────────
      # `all-features` and the advisory exceptions live in deny.toml rather than
      # as CLI arguments, so local and CI runs resolve the same graph.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./Cargo.toml

      # ── Dependency vulnerability scan ─────────────────────────────────────
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Contract WASM hash & source verification ────────────────────────────
  # Builds each deployed Rust contract, records the toolchain version, the
  # dependency lockfile reference, the optimization settings and the resulting
  # WASM hash into a verification manifest, then verifies the deployed hash and
  # detects drift between the manifest and the backend configuration.
  wasm-verify:
    name: ci/wasm-verify
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-opt
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz \
            | tar -xz -C /tmp
          echo "/tmp/binaryen-version_116/bin" >> "$GITHUB_PATH"

      - name: Build contracts and record verification manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/wasm-verify
          manifest=/tmp/wasm-verify/contract-verification.json
          toolchain=$(rustc --version)
          lockfile_hash=$(sha256sum Cargo.lock | awk '{print $1}')
          optimization="wasm-opt -Oz"

          echo '{"toolchain":"'"$toolchain"'","lockfile":"Cargo.lock","lockfile_sha256":"'"$lockfile_hash"'","optimization":"'"$optimization"'","contracts":{}}' > "$manifest"

          for crate in contracts/*/Cargo.toml; do
            name=$(basename "$(dirname "$crate")")
            cargo build --release --target wasm32-unknown-unknown --manifest-path "$crate"
            wasm=$(find "target/wasm32-unknown-unknown/release" -maxdepth 1 -name "${name//-/_}.wasm" | head -n1)
            if [ -z "$wasm" ]; then
              echo "::error::No WASM artifact produced for contract '$name'"
              exit 1
            fi
            wasm-opt -Oz "$wasm" -o "/tmp/wasm-verify/$name.wasm"
            hash=$(sha256sum "/tmp/wasm-verify/$name.wasm" | awk '{print $1}')
            echo "Contract $name WASM hash: $hash"
            jq --arg n "$name" --arg h "$hash" '.contracts[$n] = $h' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done

          cat "$manifest"

      - name: Verify deployed hash and detect drift
        run: |
          set -euo pipefail
          manifest=/tmp/wasm-verify/contract-verification.json
          config=backend/config/contracts.json

          if [ ! -f "$config" ]; then
            echo "::error::Backend contract configuration '$config' not found; cannot verify deployed hashes"
            exit 1
          fi

          drift=0
          for name in $(jq -r '.contracts | keys[]' "$manifest"); do
            built=$(jq -r --arg n "$name" '.contracts[$n]' "$manifest")
            deployed=$(jq -r --arg n "$name" '.contracts[$n].wasm_hash // empty' "$config")
            if [ -z "$deployed" ]; then
              echo "::error::Contract '$name' is missing from backend configuration '$config'"
              drift=1
              continue
            fi
            if [ "$built" != "$deployed" ]; then
              echo "::error::WASM hash drift for contract '$name': built=$built deployed=$deployed"
              drift=1
            else
              echo "Contract '$name' verified: $built"
            fi
          done

          if [ "$drift" -ne 0 ]; then
            echo "::error::Contract verification failed: deployed WASM hash does not match reviewed source build"
            exit 1
          fi

      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-verification-${{ github.sha }}
          path: /tmp/wasm-verify/contract-verification.json
          retention-days: 90
          if-no-files-found: warn
