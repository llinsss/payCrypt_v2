# Web (Frontend) CI
# Stable check name: ci/web
#
# Runs on pull_request when web source files or shared configuration change.
# Jobs:
#   detect  – path filter (always runs, ~5 s)
#   build   – lint · type-check · vite build (skipped when no relevant paths changed)
#
# Artifacts:
#   vite-build-<sha>  – production bundle retained for 7 days

name: Web CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "src/**"
              - "index.html"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "eslint.config.js"
              - "tailwind.config.js"
              - "postcss.config.js"
              - "package.json"
              - "package-lock.json"

  # ── 2. Lint · Type-check · Build ────────────────────────────────────────────
  build:
    name: ci/web
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run type-check

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (vite)
        run: npm run build

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
