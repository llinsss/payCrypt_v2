name: Frontend API Contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run type-check
      - run: npm run lint

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  audit-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install soroban-cli
        run: cargo install --locked soroban-cli
      - name: Assemble Rust/Soroban audit package
        run: |
          set -euo pipefail
          PKG_DIR="audit-package"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"

          # Tagged commit provenance for the audit-ready artifact.
          git rev-parse HEAD > "$PKG_DIR/commit.txt"
          git describe --tags --always --dirty > "$PKG_DIR/tag.txt" 2>/dev/null || echo "untagged" > "$PKG_DIR/tag.txt"
          git log -1 --format='%H %cI %s' > "$PKG_DIR/commit-metadata.txt"

          # Scope every Rust contract and privileged operation.
          {
            echo "# Rust/Soroban Contract Scope"
            echo
            echo "## Contracts"
            find . -name 'Cargo.toml' -not -path './target/*' -not -path './node_modules/*' -print0 \
              | xargs -0 -I{} dirname {} | sort -u | sed 's/^/- /'
            echo
            echo "## Privileged operations (auth/admin entrypoints)"
            grep -rn --include='*.rs' -E '#\[contractimpl\]|require_auth|require_auth_for_args|admin|owner|initialize|upgrade|set_admin' . \
              | grep -v '/target/' | grep -v '/node_modules/' | sort > "$PKG_DIR/privileged-operations.txt" || true
            cat "$PKG_DIR/privileged-operations.txt"
          } > "$PKG_DIR/scope.md"

          # Threat model covering the Soroban contract attack surface.
          cat > "$PKG_DIR/threat-model.md" <<'EOF'
          # Threat Model — Soroban Contract Attack Surface

          | Threat | Surface | Mitigation |
          | --- | --- | --- |
          | Unauthorized privileged call | admin/owner entrypoints | `require_auth` on every privileged op (see auth-matrix.md) |
          | Storage key collision / overwrite | persistent/instance/temporary keys | Typed `DataKey` enum (see storage-map.md) |
          | Reentrancy via cross-contract calls | token/contract invocations | Checks-effects-interactions; no external call before state write |
          | Integer overflow/underflow | arithmetic in contract logic | Checked math; `overflow-checks = true` in release profile |
          | Upgrade to malicious WASM | `upgrade` entrypoint | Admin-gated upgrade; WASM hash pinned in release manifest |
          | Stale/forged deployment | deployed bytecode | `verify-soroban-wasm` job pins WASM hash per network |
          | Dependency supply chain | Cargo dependencies | `cargo-deny` + `cargo-audit` in CI |
          EOF

          # Storage map: persistent/instance/temporary keys and their types.
          {
            echo "# Storage Map"
            echo
            echo "| Key | Storage | Type | Source |"
            echo "| --- | --- | --- | --- |"
            grep -rn --include='*.rs' -E 'storage\(\)\.(persistent|instance|temporary)\(\)|DataKey|enum .*Key' . \
              | grep -v '/target/' | grep -v '/node_modules/' \
              | sed -E 's/^([^:]+):([0-9]+):(.*)$/| \3 | (see source) | (see source) | \1:\2 |/' || true
          } > "$PKG_DIR/storage-map.md"

          # Auth matrix: each privileged operation -> required authorization.
          {
            echo "# Auth Matrix"
            echo
            echo "| Operation | Required Authorization | Source |"
            echo "| --- | --- | --- |"
            grep -rn --include='*.rs' -E 'require_auth|require_auth_for_args' . \
              | grep -v '/target/' | grep -v '/node_modules/' \
              | sed -E 's/^([^:]+):([0-9]+):(.*)$/| \3 | require_auth | \1:\2 |/' || true
          } > "$PKG_DIR/auth-matrix.md"

          # Invariants.
          cat > "$PKG_DIR/invariants.md" <<'EOF'
          # Invariants

          - Every privileged entrypoint enforces `require_auth` for the expected address.
          - Storage keys are unique and typed; no two logical values share a key.
          - Total supply / balances are conserved across transfers.
          - Admin can only be changed by the current admin.
          - Deployed WASM hash matches the tagged release manifest.
          EOF

          # Deployment manifests.
          mkdir -p "$PKG_DIR/release-manifests"
          if [ -d release-manifests ]; then
            cp -r release-manifests/. "$PKG_DIR/release-manifests/"
          fi

          # Reproducible test commands.
          cat > "$PKG_DIR/test-commands.md" <<'EOF'
          # Reproducible Test Commands

          ```sh
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo deny check --all-features
          cargo audit
          soroban contract build
          ```
          EOF

          # Findings mapped to source files and tests.
          {
            echo "# Findings → Source & Tests"
            echo
            echo "| Finding | Source | Test |"
            echo "| --- | --- | --- |"
            grep -rn --include='*.rs' -E '#\[test\]|#\[cfg\(test\)\]' . \
              | grep -v '/target/' | grep -v '/node_modules/' \
              | sed -E 's/^([^:]+):([0-9]+):(.*)$/| (see scope.md) | \1:\2 | \1 |/' || true
          } > "$PKG_DIR/findings.md"

          # Bundle the audit-ready artifact.
          tar -czf "audit-package.tar.gz" -C "$PKG_DIR" .
          echo "::notice::Audit package assembled at audit-package.tar.gz"
          ls -la "$PKG_DIR"
      - name: Upload audit package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-soroban-audit-package
          path: audit-package.tar.gz

  verify-soroban-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, production]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install soroban-cli
        run: cargo install --locked soroban-cli
      - name: Verify deployed WASM against release manifest
        env:
          NETWORK: ${{ matrix.network }}
          SOROBAN_RPC_URL: ${{ matrix.network == 'production' && secrets.SOROBAN_MAINNET_RPC_URL || secrets.SOROBAN_TESTNET_RPC_URL }}
        run: |
          set -euo pipefail
          MANIFEST="release-manifests/${NETWORK}.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Missing release manifest for network '$NETWORK' at $MANIFEST"
            exit 1
          fi

          read_manifest() { jq -r "$1" "$MANIFEST"; }

          CONTRACT_ID=$(read_manifest '.contract_id')
          EXPECTED_WASM_HASH=$(read_manifest '.wasm_hash')
          EXPECTED_NETWORK=$(read_manifest '.network')
          EXPECTED_TOOLCHAIN=$(read_manifest '.toolchain')
          EXPECTED_CARGO_LOCK_HASH=$(read_manifest '.cargo_lock_hash')
          EXPECTED_SDK_VERSION=$(read_manifest '.soroban_sdk_version')
          EXPECTED_OPTIMIZATION=$(read_manifest '.optimization')

          echo "Manifest ($NETWORK):"
          echo "  contract_id:        $CONTRACT_ID"
          echo "  wasm_hash:          $EXPECTED_WASM_HASH"
          echo "  network:            $EXPECTED_NETWORK"
          echo "  toolchain:          $EXPECTED_TOOLCHAIN"
          echo "  cargo_lock_hash:    $EXPECTED_CARGO_LOCK_HASH"
          echo "  soroban_sdk:        $EXPECTED_SDK_VERSION"
          echo "  optimization:       $EXPECTED_OPTIMIZATION"

          # Fail on network metadata mismatch.
          if [ "$EXPECTED_NETWORK" != "$NETWORK" ]; then
            echo "::error::Manifest network '$EXPECTED_NETWORK' does not match target network '$NETWORK'"
            exit 1
          fi

          # Fail on toolchain mismatch.
          ACTUAL_TOOLCHAIN=$(rustc --version)
          if [ "$ACTUAL_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]; then
            echo "::error::Toolchain mismatch: manifest '$EXPECTED_TOOLCHAIN' vs actual '$ACTUAL_TOOLCHAIN'"
            exit 1
          fi

          # Fail on Cargo.lock mismatch.
          ACTUAL_CARGO_LOCK_HASH=$(sha256sum Cargo.lock | awk '{print $1}')
          if [ "$ACTUAL_CARGO_LOCK_HASH" != "$EXPECTED_CARGO_LOCK_HASH" ]; then
            echo "::error::Cargo.lock hash mismatch: manifest '$EXPECTED_CARGO_LOCK_HASH' vs actual '$ACTUAL_CARGO_LOCK_HASH'"
            exit 1
          fi

          # Fail on Soroban SDK version mismatch.
          ACTUAL_SDK_VERSION=$(cargo tree -p soroban-sdk --depth 0 2>/dev/null | awk '/soroban-sdk/ {print $2; exit}')
          if [ -n "$ACTUAL_SDK_VERSION" ] && [ "$ACTUAL_SDK_VERSION" != "$EXPECTED_SDK_VERSION" ]; then
            echo "::error::Soroban SDK mismatch: manifest '$EXPECTED_SDK_VERSION' vs actual '$ACTUAL_SDK_VERSION'"
            exit 1
          fi

          # Fetch the deployed WASM bytecode hash from the target network.
          ACTUAL_WASM_HASH=$(soroban contract fetch \
            --id "$CONTRACT_ID" \
            --network "$NETWORK" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --out /tmp/deployed.wasm >/dev/null 2>&1 && sha256sum /tmp/deployed.wasm | awk '{print $1}')

          if [ -z "$ACTUAL_WASM_HASH" ]; then
            echo "::error::Unable to fetch deployed WASM for contract '$CONTRACT_ID' on '$NETWORK'"
            exit 1
          fi

          # Fail on deployed bytecode mismatch.
          if [ "$ACTUAL_WASM_HASH" != "$EXPECTED_WASM_HASH" ]; then
            echo "::error::Deployed WASM hash mismatch on '$NETWORK': manifest '$EXPECTED_WASM_HASH' vs deployed '$ACTUAL_WASM_HASH'"
            exit 1
          fi

          echo "::notice::Verified deployed Soroban WASM for '$NETWORK' (contract $CONTRACT_ID)"
