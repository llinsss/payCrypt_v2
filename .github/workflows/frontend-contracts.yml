name: Frontend API Contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run type-check
      - run: npm run lint

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upgrade-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install soroban-cli
        run: cargo install --locked soroban-cli
      - name: start local network
        run: soroban network start local
      - name: upgrade integration tests (local network)
        env:
          SOROBAN_NETWORK: local
          SOROBAN_RPC_URL: http://127.0.0.1:8000/soroban/rpc
          SOROBAN_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          SOROBAN_FRIENDLY_FIXTURE_LEDGER: "1000"
          SOROBAN_FRIENDLY_FIXTURE_TIMESTAMP: "1700000000"
        run: cargo test --all-features --test upgrade_integration -- --nocapture
      - name: stop local network
        if: always()
        run: soroban network stop local
