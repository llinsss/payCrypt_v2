name: Frontend Contracts

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'docs/runbooks/**'
      - '.github/workflows/frontend-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'docs/runbooks/**'
      - '.github/workflows/frontend-contracts.yml'

permissions:
  contents: read

concurrency:
  group: frontend-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned inputs: deterministic toolchain and Soroban target for reproducible builds.
  RUST_TOOLCHAIN: '1.79.0'
  SOROBAN_TARGET: 'wasm32-unknown-unknown'
  CARGO_TERM_COLOR: always
  # Operator runbook that must exist and stay well-formed for Rust contract failures.
  RUNBOOK_PATH: 'docs/runbooks/rust-contract-failures.md'

jobs:
  changelog-policy:
    name: Rust contract changelog policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate environment
        run: |
          set -euo pipefail
          test -f Cargo.toml || { echo '::error::Cargo.toml missing'; exit 1; }
          test -f CHANGELOG.md || { echo '::error::CHANGELOG.md missing'; exit 1; }
          echo "toolchain=${RUST_TOOLCHAIN} target=${SOROBAN_TARGET}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.SOROBAN_TARGET }}

      - name: Enforce changelog policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Artifact identity: the changelog entry must reference the contract
          # artifact(s) touched by this change so releases are traceable.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'contracts/**' 'Cargo.toml' 'Cargo.lock' || true)
          if [ -z "$changed" ]; then
            echo 'No Rust/Soroban contract changes detected; changelog policy not required.'
            exit 0
          fi

          echo 'Contract-affecting files changed:'
          echo "$changed"

          # Release approval: a changelog entry must accompany contract changes.
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'CHANGELOG.md' | grep -q 'CHANGELOG.md'; then
            echo '::error::Rust/Soroban contract changes require a CHANGELOG.md entry (release approval).'
            exit 1
          fi

          # Deterministic validation: the newest changelog entry must be a
          # well-formed, dated, non-empty release section.
          if ! grep -Eq '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md; then
            echo '::error::CHANGELOG.md must contain a dated release heading like "## [x.y.z] - YYYY-MM-DD".'
            exit 1
          fi

          echo 'Changelog policy satisfied.'

      - name: Rollback guidance
        if: failure()
        run: |
          echo '::notice::Rollback: revert the contract change or add the missing CHANGELOG.md entry, then re-run this workflow.'

  operator-runbook:
    name: Rust contract failure runbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          set -euo pipefail
          test -f Cargo.toml || { echo '::error::Cargo.toml missing'; exit 1; }
          test -f "$RUNBOOK_PATH" || { echo "::error::operator runbook missing at $RUNBOOK_PATH"; exit 1; }
          echo "runbook=${RUNBOOK_PATH} toolchain=${RUST_TOOLCHAIN} target=${SOROBAN_TARGET}"

      - name: Validate operator runbook
        run: |
          set -euo pipefail

          # Deterministic validation: the runbook must document each required
          # operator procedure for Rust/Soroban contract failures.
          required_sections=(
            'Pinned Inputs'
            'Artifact Identity'
            'Environment Validation'
            'Release Approval'
            'Rollback'
          )

          for section in "${required_sections[@]}"; do
            if ! grep -Eq "^##+ .*${section}" "$RUNBOOK_PATH"; then
              echo "::error::runbook missing required section: ${section}"
              exit 1
            fi
          done

          # The runbook must be non-trivial so operators have real guidance.
          lines=$(grep -cve '^[[:space:]]*$' "$RUNBOOK_PATH" || true)
          if [ "$lines" -lt 20 ]; then
            echo '::error::runbook is too short to be actionable.'
            exit 1
          fi

          echo 'Operator runbook validated.'

      - name: Rollback guidance
        if: failure()
        run: |
          echo '::notice::Rollback: restore the operator runbook at docs/runbooks/rust-contract-failures.md or revert the contract change, then re-run this workflow.'
