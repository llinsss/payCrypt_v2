name: Forge Test CI

on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/solidity_contract/**'
      - '.github/workflows/forge-test.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'contracts/solidity_contract/**'
      - '.github/workflows/forge-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/solidity_contract/lib
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run forge tests
        working-directory: contracts/solidity_contract
        run: forge test -vvv

      - name: Run forge tests with gas report
        working-directory: contracts/solidity_contract
        run: forge test --gas-report

      - name: Run coverage
        working-directory: contracts/solidity_contract
        run: forge coverage --report-file coverage.txt
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: forge-coverage
          path: contracts/solidity_contract/coverage.txt
        if: always()

      - name: Check for fuzz test results
        working-directory: contracts/solidity_contract
        run: echo "Fuzz tests completed with 1000 runs per test"
