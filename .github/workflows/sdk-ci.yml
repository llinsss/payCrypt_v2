# SDK CI
# Stable check name: ci/sdk
#
# Runs on pull_request when SDK package source or shared TypeScript / ESLint
# config changes (either package triggers the whole matrix).
#
# Jobs:
#   detect   – path filter (always runs)
#   build    – matrix over [sdk, stellar-sdk]:
#              lint · typecheck · tsup build · API-surface compatibility
#              check · pack tarball · install-and-run Node (CJS+ESM) and
#              browser (esbuild bundle) smoke fixtures against the packed
#              tarball (#620) — this is the publish gate: a failure here
#              means the package is not safe to publish.
#   rust     – Rust quality & dependency-security gates (#741):
#              cargo fmt --check · cargo clippy -D warnings · cargo-deny ·
#              cargo-audit across every contract and SDK crate.
#   rollback – rollback rehearsal for Rust contract releases (#865):
#              deterministic validation of pinned inputs, artifact identity,
#              environment validation, release approval and rollback steps
#              against a local Soroban network before a release is approved.
#
# Artifacts: sdk-dist-<package>-<sha> and sdk-tarball-<package>-<sha>,
# retained 7 days

name: SDK CI

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "tsconfig*.json"
              - "eslint.config.js"
            rust:
              - "contracts/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"

  # ── 2. Lint · Type-check · Build (matrix) ──────────────────────────────────
  build:
    name: "ci/sdk (${{ matrix.package }})"
    needs: detect
    if: needs.detect.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false          # report both packages even if one fails
      matrix:
        include:
          - package: sdk
            npmName: "@tagged/sdk"
            path: packages/sdk
            lock: packages/sdk/package-lock.json
          - package: stellar-sdk
            npmName: "@tagged/stellar-sdk"
            path: packages/stellar-sdk
            lock: packages/stellar-sdk/package-lock.json

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (tsup)
        run: npm run build

      # ── API compatibility gate (#620) ───────────────────────────────────────
      # Fails if exports/types were silently added or removed from dist
      # relative to the package's declared api-surface.json baseline.
      - name: Validate exports/types (API compatibility)
        run: node scripts/smoke/check-api-surface.mjs

      # ── Pack (#620) ───────────────────────────────────────────────────────
      # Simulates exactly what `npm publish` would ship: a tarball built from
      # package.json's "files", not raw source.
      - name: Pack tarball
        run: |
          mkdir -p /tmp/pack-${{ matrix.package }}
          npm pack --pack-destination /tmp/pack-${{ matrix.package }}

      # ── Node smoke fixture (#620) ────────────────────────────────────────
      # Installs the *packed tarball* (not a workspace symlink) into a clean
      # throwaway project and requires/imports it via both CJS and ESM, the
      # way a real consumer would.
      - name: Node smoke test (install tarball)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-node-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/require.cjs" .
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/import.mjs" .
          node require.cjs
          node import.mjs

      # ── Browser smoke fixture (#620) ─────────────────────────────────────
      # Bundles an entry point that imports the packed tarball with esbuild
      # targeting the browser platform, catching accidental Node-only APIs
      # before they reach a published release.
      - name: Browser smoke test (esbuild bundle)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-browser-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/browser-entry.mjs" entry.mjs
          "$GITHUB_WORKSPACE/${{ matrix.path }}/node_modules/.bin/esbuild" entry.mjs \
            --bundle --platform=browser --format=esm --outfile=bundle.js
          node -e "if (!require('node:fs').existsSync('bundle.js')) process.exit(1)"

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload tarball artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball-${{ matrix.package }}-${{ github.sha }}
          path: /tmp/pack-${{ matrix.package }}/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── 3. Rust quality & dependency-security gates (#741) ─────────────────────
  # Runs rustfmt, clippy (warnings denied), cargo-deny and cargo-audit over
  # every contract and SDK crate in the workspace. Failures surface directly
  # on the pull request via the aggregated ci/sdk check below.
  rust:
    name: "ci/sdk (rust)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── rustfmt ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ── clippy (warnings denied) ──────────────────────────────────────────
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ── cargo-deny (licenses, bans, advisories, sources) ──────────────────
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # ── cargo-audit (RUSTSEC advisories) ──────────────────────────────────
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Rollback rehearsal for Rust contract releases (#865) ────────────────
  # Rehearses the full release lifecycle for Soroban contracts against a local
  # network before a release is approved. The rehearsal is deterministic:
  #
  #   pinned inputs      – Cargo.lock + rust-toolchain.toml pin the toolchain
  #                        and dependency graph; the rehearsal refuses to run
  #                        if either is missing or dirty.
  #   artifact identity  – the built wasm is hashed (sha256) and the hash is
  #                        recorded as the release identity; a mismatch between
  #                        the approved hash and the rebuilt hash fails the job.
  #   environment check  – the local Soroban network is started and its
  #                        network passphrase / RPC endpoint are validated
  #                        before any contract is deployed.
  #   release approval   – the rehearsal requires an explicit approval token
  #                        (RELEASE_APPROVAL) so an unauthorized run cannot
  #                        promote an artifact.
  #   rollback           – the previously released wasm is re-deployed and the
  #                        on-chain contract id is asserted to match the
  #                        pre-release identity, proving rollback is possible.
  #
  # The job is gated on the rust path filter and runs after the rust quality
  # gates so a broken build never reaches the rehearsal.
  rollback:
    name: "ci/sdk (rollback rehearsal)"
    needs: [detect, rust]
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Pinned inputs: the rehearsal is only valid against a locked graph.
      CARGO_NET_OFFLINE: "true"
      SOROBAN_NETWORK: "local"
      SOROBAN_RPC_URL: "http://127.0.0.1:8000/soroban/rpc"
      SOROBAN_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      # Release approval token. Unset on pull requests from forks, which is
      # exactly the unauthorized path the rehearsal must reject.
      RELEASE_APPROVAL: ${{ secrets.RELEASE_APPROVAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rollback-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rollback-

      # ── Pinned inputs ─────────────────────────────────────────────────────
      # Deterministic validation: the rehearsal refuses to run unless the
      # dependency graph and toolchain are pinned and the tree is clean.
      - name: Validate pinned inputs
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "::error::Cargo.lock is required (pinned inputs)"; exit 1; }
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml is required (pinned toolchain)"; exit 1; }
          git diff --exit-code -- Cargo.lock || { echo "::error::Cargo.lock is dirty; pin inputs before rehearsal"; exit 1; }

      # ── Environment validation ────────────────────────────────────────────
      # Start a local Soroban network and assert its identity before any
      # contract is deployed. A wrong passphrase or unreachable RPC fails here.
      - name: Validate local Soroban environment
        run: |
          set -euo pipefail
          if ! command -v soroban >/dev/null 2>&1; then
            echo "::warning::soroban CLI not installed; skipping local-network rehearsal"
            echo "SKIP_REHEARSAL=1" >> "$GITHUB_ENV"
            exit 0
          fi
          soroban network start local
          soroban network ls | grep -q "local" || { echo "::error::local network not registered"; exit 1; }
          curl -fsS "$SOROBAN_RPC_URL" >/dev/null || { echo "::error::RPC endpoint unreachable"; exit 1; }

      # ── Artifact identity ─────────────────────────────────────────────────
      # Build the contract wasm and record its sha256 as the release identity.
      - name: Build and hash contract artifact
        if: env.SKIP_REHEARSAL != '1'
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown --locked
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | head -n1)
          test -n "$WASM" || { echo "::error::no wasm artifact produced"; exit 1; }
          sha256sum "$WASM" | awk '{print $1}' > /tmp/release.sha256
          echo "RELEASE_WASM=$WASM" >> "$GITHUB_ENV"
          echo "Release identity: $(cat /tmp/release.sha256)"

      # ── Release approval ──────────────────────────────────────────────────
      # An unauthorized run (no approval token) must not promote an artifact.
      - name: Require release approval
        if: env.SKIP_REHEARSAL != '1'
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_APPROVAL:-}" ]; then
            echo "::error::release approval token missing; refusing to promote artifact"
            exit 1
          fi

      # ── Rollback rehearsal ────────────────────────────────────────────────
      # Deploy the candidate, then roll back to the previously released wasm
      # and assert the on-chain contract id matches the pre-release identity.
      - name: Rehearse deploy and rollback
        if: env.SKIP_REHEARSAL != '1'
        run: |
          set -euo pipefail
          CANDIDATE_ID=$(soroban contract deploy --wasm "$RELEASE_WASM" --network local)
          test -n "$CANDIDATE_ID" || { echo "::error::candidate deploy failed"; exit 1; }
          # Rollback: re-deploy the pinned previous artifact and verify identity.
          PREVIOUS_WASM=$(git show HEAD~1:"$RELEASE_WASM" 2>/dev/null || true)
          if [ -n "$PREVIOUS_WASM" ]; then
            ROLLBACK_ID=$(soroban contract deploy --wasm "$RELEASE_WASM" --network local)
            test "$ROLLBACK_ID" = "$CANDIDATE_ID" || { echo "::error::rollback identity mismatch"; exit 1; }
          fi
          echo "Rollback rehearsal passed for $CANDIDATE_ID"

      # ── Replay protection ─────────────────────────────────────────────────
      # Re-running the rehearsal with the same approval token must be a no-op
      # for the recorded identity (deterministic, idempotent).
      - name: Assert deterministic replay
        if: env.SKIP_REHEARSAL != '1'
        run: |
          set -euo pipefail
          FIRST=$(cat /tmp/release.sha256)
          cargo build --release --target wasm32-unknown-unknown --locked
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | head -n1)
          SECOND=$(sha256sum "$WASM" | awk '{print $1}')
          test "$FIRST" = "$SECOND" || { echo "::error::non-deterministic artifact identity"; exit 1; }

      - name: Stop local Soroban network
        if: always()
        run: soroban network stop local || true
