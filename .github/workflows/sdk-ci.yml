name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-soroban-release-checklist:
    name: Rust/Soroban release checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.79.0"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify pinned inputs (Cargo.lock committed and in sync)
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "::error::Cargo.lock is missing; pinned inputs are required"; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Environment validation
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustup target list --installed | grep -q wasm32-unknown-unknown \
            || rustup target add wasm32-unknown-unknown
          rustup target list --installed | grep -q wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Unit, property, and local-network tests
        run: cargo test --locked --all-features

      - name: Build Soroban wasm artifacts
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Artifact identity (deterministic hashes)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No wasm artifacts produced; cannot establish artifact identity"
            exit 1
          fi
          (cd artifacts && sha256sum ./*.wasm | tee ../artifacts.sha256)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-release-artifacts
          path: |
            artifacts/*.wasm
            artifacts.sha256
          if-no-files-found: error

  release-approval:
    name: Release approval gate
    needs: rust-soroban-release-checklist
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: soroban-release
    steps:
      - name: Require manual approval
        run: |
          echo "Release approval granted for ${{ github.sha }} by ${{ github.actor }}"
          echo "Artifacts promoted from the rust-soroban-release-checklist job."

  rollback:
    name: Rollback procedure
    needs: release-approval
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback guidance
        run: |
          echo "::warning::Release failed after approval. Roll back to the last known-good artifact."
          echo "1. Re-deploy the previously approved wasm artifact (see artifacts.sha256 history)."
          echo "2. Re-run the rust-soroban-release-checklist job against the rollback commit."
          echo "3. Verify indexer reconciliation and ledger-gap alerts return to baseline."
