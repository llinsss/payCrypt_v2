# SDK CI
# Stable check name: ci/sdk
#
# Runs on pull_request when SDK package source or shared TypeScript / ESLint
# config changes (either package triggers the whole matrix).
#
# Jobs:
#   detect   – path filter (always runs)
#   build    – matrix over [sdk, stellar-sdk]:
#              lint · typecheck · tsup build · API-surface compatibility
#              check · pack tarball · install-and-run Node (CJS+ESM) and
#              browser (esbuild bundle) smoke fixtures against the packed
#              tarball (#620) — this is the publish gate: a failure here
#              means the package is not safe to publish.
#   rust     – Rust quality & dependency-security gates (#741):
#              cargo fmt --check · cargo clippy -D warnings · cargo-deny ·
#              cargo-audit across every contract and SDK crate.
#   compat   – release & compatibility matrix gate (#758): validates the
#              machine-readable matrix (Rust version, Soroban SDK, protocol
#              version, network passphrase, contract WASM, client crate) and
#              tests each supported network combination against it.
#
# Artifacts: sdk-dist-<package>-<sha> and sdk-tarball-<package>-<sha>,
# retained 7 days

name: SDK CI

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "compatibility-matrix.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "compatibility-matrix.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      rust: ${{ steps.filter.outputs.rust }}
      compat: ${{ steps.filter.outputs.compat }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "tsconfig*.json"
              - "eslint.config.js"
            rust:
              - "contracts/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
            compat:
              - "compatibility-matrix.json"
              - "contracts/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/sdk-ci.yml"

  # ── 2. Lint · Type-check · Build (matrix) ──────────────────────────────────
  build:
    name: "ci/sdk (${{ matrix.package }})"
    needs: detect
    if: needs.detect.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false          # report both packages even if one fails
      matrix:
        include:
          - package: sdk
            npmName: "@tagged/sdk"
            path: packages/sdk
            lock: packages/sdk/package-lock.json
          - package: stellar-sdk
            npmName: "@tagged/stellar-sdk"
            path: packages/stellar-sdk
            lock: packages/stellar-sdk/package-lock.json

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (tsup)
        run: npm run build

      # ── API compatibility gate (#620) ───────────────────────────────────────
      # Fails if exports/types were silently added or removed from dist
      # relative to the package's declared api-surface.json baseline.
      - name: Validate exports/types (API compatibility)
        run: node scripts/smoke/check-api-surface.mjs

      # ── Pack (#620) ───────────────────────────────────────────────────────
      # Simulates exactly what `npm publish` would ship: a tarball built from
      # package.json's "files", not raw source.
      - name: Pack tarball
        run: |
          mkdir -p /tmp/pack-${{ matrix.package }}
          npm pack --pack-destination /tmp/pack-${{ matrix.package }}

      # ── Node smoke fixture (#620) ────────────────────────────────────────
      # Installs the *packed tarball* (not a workspace symlink) into a clean
      # throwaway project and requires/imports it via both CJS and ESM, the
      # way a real consumer would.
      - name: Node smoke test (install tarball)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-node-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/require.cjs" .
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/import.mjs" .
          node require.cjs
          node import.mjs

      # ── Browser smoke fixture (#620) ─────────────────────────────────────
      # Bundles an entry point that imports the packed tarball with esbuild
      # targeting the browser platform, catching accidental Node-only APIs
      # before they reach a published release.
      - name: Browser smoke test (esbuild bundle)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-browser-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/browser-entry.mjs" entry.mjs
          "$GITHUB_WORKSPACE/${{ matrix.path }}/node_modules/.bin/esbuild" entry.mjs \
            --bundle --platform=browser --format=esm --outfile=bundle.js
          node -e "if (!require('node:fs').existsSync('bundle.js')) process.exit(1)"

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload tarball artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball-${{ matrix.package }}-${{ github.sha }}
          path: /tmp/pack-${{ matrix.package }}/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── 3. Rust quality & dependency-security gates (#741) ─────────────────────
  # Runs rustfmt, clippy (warnings denied), cargo-deny and cargo-audit over
  # every contract and SDK crate in the workspace. Failures surface directly
  # on the pull request via the aggregated ci/sdk check below.
  rust:
    name: "ci/sdk (rust)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── rustfmt ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ── clippy (warnings denied) ──────────────────────────────────────────
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 4. Release & compatibility matrix (#758) ───────────────────────────────
  # Validates the machine-readable compatibility-matrix.json (Rust version,
  # Soroban SDK, protocol version, network passphrase, contract WASM, client
  # crate) and exercises every supported network combination declared in it.
  compat:
    name: "ci/sdk (compat)"
    needs: detect
    if: needs.detect.outputs.compat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        network: [testnet, futurenet, mainnet]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Matrix schema & consistency validation ────────────────────────────
      # Fails if the matrix is missing required fields, references an
      # unsupported network, or declares a network passphrase that does not
      # match the canonical Stellar passphrase for that network.
      - name: Validate compatibility matrix
        run: |
          node -e "
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('compatibility-matrix.json', 'utf8'));
          const required = ['rustVersion', 'sorobanSdk', 'protocolVersion', 'contractWasm', 'clientCrate', 'networks'];
          for (const key of required) {
            if (m[key] === undefined) { console.error('missing matrix field: ' + key); process.exit(1); }
          }
          const passphrases = {
            testnet: 'Test SDF Network ; September 2015',
            futurenet: 'Test SDF Future Network ; October 2022',
            mainnet: 'Public Global Stellar Network ; September 2015',
          };
          for (const [name, net] of Object.entries(m.networks)) {
            if (!passphrases[name]) { console.error('unsupported network: ' + name); process.exit(1); }
            if (net.networkPassphrase !== passphrases[name]) {
              console.error('passphrase mismatch for ' + name); process.exit(1);
            }
          }
          console.log('compatibility matrix OK');
          "

      # ── Per-network combination test ──────────────────────────────────────
      # Confirms the matrix declares the network under test and that its
      # passphrase matches the canonical value, so every supported network
      # combination is exercised in CI.
      - name: Test network combination (${{ matrix.network }})
        run: |
          node -e "
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('compatibility-matrix.json', 'utf8'));
          const net = m.networks['${{ matrix.network }}'];
          if (!net) { console.error('network not declared in matrix: ${{ matrix.network }}'); process.exit(1); }
          if (!net.networkPassphrase) { console.error('missing passphrase'); process.exit(1); }
          console.log('network combination OK: ${{ matrix.network }}');
          "
