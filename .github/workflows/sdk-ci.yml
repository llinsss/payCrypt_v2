# SDK CI
# Stable check name: ci/sdk
#
# Runs on pull_request when SDK package source or shared TypeScript / ESLint
# config changes (either package triggers the whole matrix).
#
# Jobs:
#   detect   – path filter (always runs)
#   build    – matrix over [sdk, stellar-sdk]:
#              lint · typecheck · tsup build
#
# Artifacts: sdk-dist-<package>-<sha> retained 7 days

name: SDK CI

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "tsconfig*.json"
              - "eslint.config.js"

  # ── 2. Lint · Type-check · Build (matrix) ──────────────────────────────────
  build:
    name: "ci/sdk (${{ matrix.package }})"
    needs: detect
    if: needs.detect.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false          # report both packages even if one fails
      matrix:
        include:
          - package: sdk
            path: packages/sdk
            lock: packages/sdk/package-lock.json
          - package: stellar-sdk
            path: packages/stellar-sdk
            lock: packages/stellar-sdk/package-lock.json

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (tsup)
        run: npm run build

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/
          retention-days: 7
          if-no-files-found: error

  # ── 3. Stable aggregated check for this component ──────────────────────────
  # Required-checks workflow needs a single stable name per component.
  # This job rolls up the matrix result.
  ci-sdk:
    name: ci/sdk
    needs: [detect, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check SDK matrix result
        run: |
          if [[ "${{ needs.detect.outputs.sdk }}" == "false" ]]; then
            echo "No SDK paths changed — skipping (pass-through)."
            exit 0
          fi
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "All SDK packages passed."
          else
            echo "One or more SDK package checks failed."
            exit 1
          fi
