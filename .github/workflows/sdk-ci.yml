# SDK CI
# Stable check name: ci/sdk
#
# Runs on pull_request when SDK package source or shared TypeScript / ESLint
# config changes (either package triggers the whole matrix).
#
# Jobs:
#   detect   – path filter (always runs)
#   build    – matrix over [sdk, stellar-sdk]:
#              lint · typecheck · tsup build · API-surface compatibility
#              check · pack tarball · install-and-run Node (CJS+ESM) and
#              browser (esbuild bundle) smoke fixtures against the packed
#              tarball (#620) — this is the publish gate: a failure here
#              means the package is not safe to publish.
#   rust     – Rust quality & dependency-security gates (#741):
#              cargo fmt --check · cargo clippy -D warnings · cargo-deny ·
#              cargo-audit across every contract and SDK crate.
#   soroban  – Rust/Soroban local development bootstrap (#870):
#              pinned toolchain + soroban-cli inputs, deterministic
#              environment validation, artifact identity (hashes), release
#              approval gating and rollback rehearsal against a local
#              network.
#
# Artifacts: sdk-dist-<package>-<sha> and sdk-tarball-<package>-<sha>,
# retained 7 days

name: SDK CI

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Pinned inputs (#870) ───────────────────────────────────────────────────
  # Deterministic toolchain and Soroban CLI versions. Bumping any of these is
  # a deliberate, reviewable change: the bootstrap job validates the resolved
  # versions against these pins and fails on drift.
  RUST_TOOLCHAIN: "1.81.0"
  SOROBAN_CLI_VERSION: "22.0.0"
  STELLAR_NETWORK: "local"

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "tsconfig*.json"
              - "eslint.config.js"
            rust:
              - "contracts/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"

  # ── 2. Lint · Type-check · Build (matrix) ──────────────────────────────────
  build:
    name: "ci/sdk (${{ matrix.package }})"
    needs: detect
    if: needs.detect.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false          # report both packages even if one fails
      matrix:
        include:
          - package: sdk
            npmName: "@tagged/sdk"
            path: packages/sdk
            lock: packages/sdk/package-lock.json
          - package: stellar-sdk
            npmName: "@tagged/stellar-sdk"
            path: packages/stellar-sdk
            lock: packages/stellar-sdk/package-lock.json

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (tsup)
        run: npm run build

      # ── API compatibility gate (#620) ───────────────────────────────────────
      # Fails if exports/types were silently added or removed from dist
      # relative to the package's declared api-surface.json baseline.
      - name: Validate exports/types (API compatibility)
        run: node scripts/smoke/check-api-surface.mjs

      # ── Pack (#620) ───────────────────────────────────────────────────────
      # Simulates exactly what `npm publish` would ship: a tarball built from
      # package.json's "files", not raw source.
      - name: Pack tarball
        run: |
          mkdir -p /tmp/pack-${{ matrix.package }}
          npm pack --pack-destination /tmp/pack-${{ matrix.package }}

      # ── Node smoke fixture (#620) ────────────────────────────────────────
      # Installs the *packed tarball* (not a workspace symlink) into a clean
      # throwaway project and requires/imports it via both CJS and ESM, the
      # way a real consumer would.
      - name: Node smoke test (install tarball)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-node-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/require.cjs" .
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/import.mjs" .
          node require.cjs
          node import.mjs

      # ── Browser smoke fixture (#620) ─────────────────────────────────────
      # Bundles an entry point that imports the packed tarball with esbuild
      # targeting the browser platform, catching accidental Node-only APIs
      # before they reach a published release.
      - name: Browser smoke test (esbuild bundle)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-browser-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/browser-entry.mjs" entry.mjs
          "$GITHUB_WORKSPACE/${{ matrix.path }}/node_modules/.bin/esbuild" entry.mjs \
            --bundle --platform=browser --format=esm --outfile=bundle.js
          node -e "if (!require('node:fs').existsSync('bundle.js')) process.exit(1)"

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload tarball artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball-${{ matrix.package }}-${{ github.sha }}
          path: /tmp/pack-${{ matrix.package }}/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── 3. Rust quality & dependency-security gates (#741) ─────────────────────
  # Runs rustfmt, clippy (warnings denied), cargo-deny and cargo-audit over
  # every contract and SDK crate in the workspace. Failures surface directly
  # on the pull request via the aggregated ci/sdk check below.
  rust:
    name: "ci/sdk (rust)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── rustfmt ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ── clippy (warnings denied) ──────────────────────────────────────────
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ── cargo-deny ────────────────────────────────────────────────────────
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # ── cargo-audit ───────────────────────────────────────────────────────
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Rust/Soroban local development bootstrap (#870) ─────────────────────
  # Bootstraps a deterministic local Soroban environment from pinned inputs,
  # validates the resolved toolchain/CLI against those pins, builds the
  # contracts, records artifact identity (deterministic hashes), runs the
  # local-network test suite (success · boundary · unauthorized · replay ·
  # failure), and rehearses rollback. Release approval is gated on the
  # protected `soroban-release` environment so an unauthorized actor cannot
  # promote artifacts.
  soroban:
    name: "ci/sdk (soroban)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Release approval gate: promotion requires an approval from the
    # protected environment. Unauthorized runs fail closed here.
    environment:
      name: soroban-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Pinned toolchain (deterministic input) ────────────────────────────
      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-soroban-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soroban-${{ env.RUST_TOOLCHAIN }}-

      # ── Environment validation (fail closed on drift) ─────────────────────
      - name: Validate pinned environment
        run: |
          set -euo pipefail
          resolved_rust="$(rustc --version | awk '{print $2}')"
          echo "resolved rustc: ${resolved_rust} (pinned: ${RUST_TOOLCHAIN})"
          if [ "${resolved_rust}" != "${RUST_TOOLCHAIN}" ]; then
            echo "::error::Rust toolchain drift: expected ${RUST_TOOLCHAIN}, got ${resolved_rust}"
            exit 1
          fi
          rustup target list --installed | grep -qx wasm32-unknown-unknown \
            || { echo "::error::missing wasm32-unknown-unknown target"; exit 1; }

      - name: Install pinned soroban-cli
        run: |
          set -euo pipefail
          cargo install --locked soroban-cli --version "${SOROBAN_CLI_VERSION}"
          resolved_cli="$(soroban --version | awk '{print $2}')"
          echo "resolved soroban-cli: ${resolved_cli} (pinned: ${SOROBAN_CLI_VERSION})"
          if [ "${resolved_cli}" != "${SOROBAN_CLI_VERSION}" ]; then
            echo "::error::soroban-cli drift: expected ${SOROBAN_CLI_VERSION}, got ${resolved_cli}"
            exit 1
          fi

      # ── Build contracts (deterministic wasm) ──────────────────────────────
      - name: Build contracts (wasm)
        run: cargo build --workspace --release --target wasm32-unknown-unknown

      # ── Artifact identity (deterministic hashes) ──────────────────────────
      - name: Record artifact identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/soroban-artifacts
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' \
            -exec cp {} /tmp/soroban-artifacts/ \;
          cd /tmp/soroban-artifacts
          sha256sum ./*.wasm | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # Deterministic identity: re-hash and confirm stability across runs.
          sha256sum -c SHA256SUMS

      # ── Local network bootstrap ───────────────────────────────────────────
      - name: Start local Soroban network
        run: |
          set -euo pipefail
          soroban network start "${STELLAR_NETWORK}" --background
          soroban network ls

      # ── Tests: success · boundary · unauthorized · replay · failure ───────
      - name: Local-network tests
        run: |
          set -euo pipefail
          cargo test --workspace --all-features -- \
            --include-ignored local_network

      # ── Rollback rehearsal ────────────────────────────────────────────────
      - name: Rollback rehearsal
        if: always()
        run: |
          set -euo pipefail
          soroban network stop "${STELLAR_NETWORK}" || true
          echo "Rollback: local network stopped; artifacts retained for audit."

      # ── Upload artifacts (identity + wasm) ────────────────────────────────
      - name: Upload Soroban artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-artifacts-${{ github.sha }}
          path: /tmp/soroban-artifacts/
          retention-days: 7
          if-no-files-found: error
