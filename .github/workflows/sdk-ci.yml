# SDK CI
# Stable check name: ci/sdk
#
# Runs on pull_request when SDK package source or shared TypeScript / ESLint
# config changes (either package triggers the whole matrix).
#
# Jobs:
#   detect   – path filter (always runs)
#   build    – matrix over [sdk, stellar-sdk]:
#              lint · typecheck · tsup build · API-surface compatibility
#              check · pack tarball · install-and-run Node (CJS+ESM) and
#              browser (esbuild bundle) smoke fixtures against the packed
#              tarball (#620) — this is the publish gate: a failure here
#              means the package is not safe to publish.
#   rust     – Rust quality & dependency-security gates (#741):
#              cargo fmt --check · cargo clippy -D warnings · cargo-deny ·
#              cargo-audit across every contract and SDK crate.
#   fuzz     – payment amount arithmetic fuzz tests (#826):
#              cargo-fuzz targets for the payment amount arithmetic module,
#              run for a bounded time on every PR that touches contracts/**.
#
# Artifacts: sdk-dist-<package>-<sha> and sdk-tarball-<package>-<sha>,
# retained 7 days

name: SDK CI

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "tsconfig*.json"
              - "eslint.config.js"
            rust:
              - "contracts/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"

  # ── 2. Lint · Type-check · Build (matrix) ──────────────────────────────────
  build:
    name: "ci/sdk (${{ matrix.package }})"
    needs: detect
    if: needs.detect.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false          # report both packages even if one fails
      matrix:
        include:
          - package: sdk
            npmName: "@tagged/sdk"
            path: packages/sdk
            lock: packages/sdk/package-lock.json
          - package: stellar-sdk
            npmName: "@tagged/stellar-sdk"
            path: packages/stellar-sdk
            lock: packages/stellar-sdk/package-lock.json

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (tsup)
        run: npm run build

      # ── API compatibility gate (#620) ───────────────────────────────────────
      # Fails if exports/types were silently added or removed from dist
      # relative to the package's declared api-surface.json baseline.
      - name: Validate exports/types (API compatibility)
        run: node scripts/smoke/check-api-surface.mjs

      # ── Pack (#620) ───────────────────────────────────────────────────────
      # Simulates exactly what `npm publish` would ship: a tarball built from
      # package.json's "files", not raw source.
      - name: Pack tarball
        run: |
          mkdir -p /tmp/pack-${{ matrix.package }}
          npm pack --pack-destination /tmp/pack-${{ matrix.package }}

      # ── Node smoke fixture (#620) ────────────────────────────────────────
      # Installs the *packed tarball* (not a workspace symlink) into a clean
      # throwaway project and requires/imports it via both CJS and ESM, the
      # way a real consumer would.
      - name: Node smoke test (install tarball)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-node-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/require.cjs" .
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/import.mjs" .
          node require.cjs
          node import.mjs

      # ── Browser smoke fixture (#620) ─────────────────────────────────────
      # Bundles an entry point that imports the packed tarball with esbuild
      # targeting the browser platform, catching accidental Node-only APIs
      # before they reach a published release.
      - name: Browser smoke test (esbuild bundle)
        run: |
          set -euo pipefail
          FIXTURE=/tmp/smoke-browser-${{ matrix.package }}
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          npm init -y >/dev/null
          npm install /tmp/pack-${{ matrix.package }}/*.tgz
          cp "$GITHUB_WORKSPACE/${{ matrix.path }}/scripts/smoke/browser-entry.mjs" entry.mjs
          "$GITHUB_WORKSPACE/${{ matrix.path }}/node_modules/.bin/esbuild" entry.mjs \
            --bundle --platform=browser --format=esm --outfile=bundle.js
          node -e "if (!require('node:fs').existsSync('bundle.js')) process.exit(1)"

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload tarball artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball-${{ matrix.package }}-${{ github.sha }}
          path: /tmp/pack-${{ matrix.package }}/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── 3. Rust quality & dependency-security gates (#741) ─────────────────────
  # Runs rustfmt, clippy (warnings denied), cargo-deny and cargo-audit over
  # every contract and SDK crate in the workspace. Failures surface directly
  # on the pull request via the aggregated ci/sdk check below.
  rust:
    name: "ci/sdk (rust)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── rustfmt ───────────────────────────────────────────────────────────
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ── clippy (warnings denied) ──────────────────────────────────────────
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ── cargo-deny ────────────────────────────────────────────────────────
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # ── cargo-audit ───────────────────────────────────────────────────────
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Payment amount arithmetic fuzz tests (#826) ─────────────────────────
  # Runs the cargo-fuzz targets that exercise payment amount arithmetic
  # (add/sub/mul/div, overflow, rounding, authorization and boundary values)
  # for a bounded wall-clock budget so regressions surface on the PR without
  # blocking the pipeline indefinitely. Deterministic seeds are pinned via
  # FUZZ_SEED so failures are reproducible locally.
  fuzz:
    name: "ci/sdk (fuzz)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # ── Fuzz payment amount arithmetic (#826) ─────────────────────────────
      # Each target runs for a bounded number of seconds with a pinned seed so
      # the run is deterministic and reproducible. Targets cover success,
      # boundary, unauthorized, replay and external-call failure paths.
      - name: Fuzz payment amount arithmetic
        env:
          FUZZ_SEED: "826"
          FUZZ_SECONDS: "30"
        run: |
          set -euo pipefail
          if [ ! -d contracts/fuzz ]; then
            echo "No contracts/fuzz directory found; skipping fuzz targets."
            exit 0
          fi
          cd contracts/fuzz
          for target in $(cargo fuzz list); do
            echo "::group::fuzz target: ${target}"
            cargo fuzz run "${target}" -- \
              -seed="${FUZZ_SEED}" \
              -max_total_time="${FUZZ_SECONDS}" \
              -rss_limit_mb=2048
            echo "::endgroup::"
          done

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: contracts/fuzz/artifacts/
          retention-days: 7
          if-no-files-found: ignore
