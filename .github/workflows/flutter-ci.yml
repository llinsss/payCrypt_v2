name: Flutter CI

on:
  push:
    branches: [master]
    paths:
      - "Mobileapp/Tagg/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Mobileapp/Tagg/**"
      - ".github/workflows/flutter-ci.yml"

defaults:
  run:
    working-directory: Mobileapp/Tagg

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
