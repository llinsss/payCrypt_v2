name: Backend Extended Tests

# Runs comprehensive backend tests including:
# - Standard unit and integration tests
# - Database migration tests
# - Regression test: verify demo data never loads in production scripts
# - Rust/Soroban contract fuzzing and authorization coverage gates

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-tests.yml"

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
            contracts:
              - "contracts/**"

  # ── 2. Migration Tests ─────────────────────────────────────────────────────
  migration-tests:
    name: Migration Tests
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: paycrypt_test_migrations
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test_migrations
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paycrypt_test_migrations
      DB_NAME_TEST_MIGRATIONS: paycrypt_test_migrations
      DB_USER: test_user
      DB_PASSWORD: test_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migration tests
        run: npm run test:migrations

  # ── 3. Production Script Regression Tests ──────────────────────────────────
  regression-tests:
    name: Production Script Regression Tests
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: paycrypt_regression
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paycrypt_regression
      DB_USER: test_user
      DB_PASSWORD: test_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production seed regression test
        run: npm run test -- --testPathPattern='tests/production-seed-regression' --forceExit
        continue-on-error: false

      - name: Verify no demo data in production seeds
        run: node scripts/verify-no-demo-data.js
        continue-on-error: false

  # ── 4. Rust/Soroban Contract Fuzzing & Authorization Coverage Gates ────────
  contract-fuzz-and-auth-coverage:
    name: Contract Fuzz & Authorization Coverage
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts

    env:
      # Deterministic seeds so fuzz runs are reproducible in CI.
      PROPTEST_CASES: "256"
      PROPTEST_SEED: "0x5eed771"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz and cargo-llvm-cov
        run: |
          cargo install cargo-fuzz --locked
          cargo install cargo-llvm-cov --locked

      - name: Build contracts
        run: cargo build --workspace --all-targets --locked

      - name: Run unit and integration tests
        run: cargo test --workspace --locked

      # Fuzz tags, amounts, callers, ledger time, and operation sequences.
      - name: Run fuzz targets (deterministic seeds)
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(fuzz/fuzz_targets/*.rs)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::No fuzz targets found under contracts/fuzz/fuzz_targets"
            exit 1
          fi
          for target in "${targets[@]}"; do
            name="$(basename "${target}" .rs)"
            echo "::group::fuzz target: ${name}"
            cargo fuzz run "${name}" -- -runs=10000 -seed="${PROPTEST_SEED}"
            echo "::endgroup::"
          done

      # Require an authorization test for every public method.
      - name: Enforce authorization coverage for every public method
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --include-ignored auth
          node scripts/check-auth-coverage.js

      # Publish coverage and deterministic seeds in CI.
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Publish coverage and seeds summary
        run: |
          {
            echo "## Contract fuzz & authorization coverage"
            echo ""
            echo "- Deterministic fuzz seed: \`${PROPTEST_SEED}\`"
            echo "- Fuzz cases per target: \`${PROPTEST_CASES}\`"
            echo "- Coverage report: \`contracts/lcov.info\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage-lcov
          path: contracts/lcov.info
          if-no-files-found: error

      - name: Upload fuzz corpus artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-fuzz-corpus
          path: contracts/fuzz/corpus
          if-no-files-found: ignore
