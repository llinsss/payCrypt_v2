name: Backend Extended Tests

# Runs comprehensive backend tests including:
# - Standard unit and integration tests
# - Database migration tests
# - Regression test: verify demo data never loads in production scripts
# - Rust integration tests against a deterministic local Stellar/Soroban network

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "contracts/**"
      - "indexer/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "indexer/**"
      - ".github/workflows/backend-tests.yml"

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # ── 1. Path filter ─────────────────────────────────────────────────────────
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
            indexer:
              - "indexer/**"

  # ── 2. Migration Tests ─────────────────────────────────────────────────────
  migration-tests:
    name: Migration Tests
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: paycrypt_test_migrations
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test_migrations
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paycrypt_test_migrations
      DB_NAME_TEST_MIGRATIONS: paycrypt_test_migrations
      DB_USER: test_user
      DB_PASSWORD: test_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migration tests
        run: npm run test:migrations

  # ── 3. Production Script Regression Tests ──────────────────────────────────
  regression-tests:
    name: Production Script Regression Tests
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: paycrypt_regression
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paycrypt_regression
      DB_USER: test_user
      DB_PASSWORD: test_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production seed regression test
        run: npm run test -- --testPathPattern='tests/production-seed-regression' --forceExit
        continue-on-error: false

      - name: Verify no demo data in production seeds
        run: node scripts/verify-no-demo-data.js
        continue-on-error: false

  # ── 4. Soroban Integration Tests ───────────────────────────────────────────
  soroban-integration-tests:
    name: Soroban Integration Tests
    needs: detect
    if: needs.detect.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: paycrypt_soroban
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paycrypt_soroban
      DB_USER: test_user
      DB_PASSWORD: test_pass
      # Deterministic local Stellar/Soroban network endpoints.
      SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
      STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      STELLAR_FRIENDBOT_URL: http://localhost:8000/friendbot
      SOROBAN_CONTRACT_WASM: indexer/target/wasm32-unknown-unknown/release/paycrypt_contract.wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            indexer/target
          key: ${{ runner.os }}-cargo-soroban-${{ hashFiles('indexer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-soroban-

      - name: Install soroban-cli
        run: cargo install --locked soroban-cli --version 21.0.0

      - name: Build reviewed WASM artifacts
        working-directory: indexer
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Start deterministic local Stellar/Soroban network
        run: |
          docker run -d --name soroban-local \
            -p 8000:8000 \
            --health-cmd "curl -sf http://localhost:8000/soroban/rpc || exit 1" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 30 \
            stellar/quickstart:testing \
            --local --enable-soroban-rpc

      - name: Wait for local network readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc >/dev/null; then
              echo "Soroban RPC is ready"
              exit 0
            fi
            echo "Waiting for Soroban RPC ($i/60)..."
            sleep 2
          done
          echo "Soroban RPC did not become ready in time" >&2
          docker logs soroban-local || true
          exit 1

      - name: Deploy reviewed WASM artifacts
        working-directory: indexer
        run: |
          soroban contract deploy \
            --wasm "$SOROBAN_CONTRACT_WASM" \
            --source-account default \
            --network local \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE"

      - name: Run Soroban integration tests
        working-directory: indexer
        run: cargo test --test integration -- --nocapture

      - name: Dump local network logs on failure
        if: failure()
        run: docker logs soroban-local || true

      - name: Stop local network
        if: always()
        run: docker rm -f soroban-local || true
